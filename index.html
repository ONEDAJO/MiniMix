<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#7dd5ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="MiniMix"><title>MiniMix 3.0.4</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="minimix.css"></head><body><main id="app"><header><strong>🌈 MiniMix 3.0.4</strong><span class="stars">⭐ <b id="stars">0</b></span></header>
<section id="menu" class="panel"><h1>Vad vill du leka?</h1><p>Tryck på en bild!</p><div id="categories" class="grid">
<button class="choice animal category" data-cat="animal" data-name="Djur">🦁<span>Djur</span></button><button class="choice number category" data-cat="number" data-name="Siffror">🔢<span>Siffror</span></button><button class="choice letter category" data-cat="letter" data-name="Bokstäver">🔤<span>Bokstäver</span></button><button class="choice color category" data-cat="color" data-name="Färger">🎨<span>Färger</span></button><button class="choice math category" data-cat="math" data-name="Räkna">🧮<span>Räkna</span></button><button class="choice read category" data-cat="read" data-name="Läsa">📖<span>Läsa</span></button><button class="choice mix category wide" data-cat="mix" data-name="Blanda allt">🎲<span>Blanda allt</span></button></div><button id="adultOpen" class="secondary">⚙️ För vuxna</button><p id="startup" class="status">Startar MiniMix…</p></section>
<section id="submenu" class="panel hidden"><h1 id="submenuTitle"></h1><div id="submenuButtons" class="grid"></div><button class="secondary backMenu">‹ Tillbaka</button></section>
<section id="difficulty" class="panel hidden"><h1>🎚️ Välj nivå</h1><div class="grid"><button class="choice easy diff" data-diff="easy">🌱<span>Lätt</span></button><button class="choice normal diff" data-diff="normal">⭐<span>Normal</span></button><button class="choice hard diff wide" data-diff="hard">🚀<span>Svår</span></button></div><button id="difficultyBack" class="secondary">‹ Tillbaka</button></section>
<section id="length" class="panel hidden"><h1>⭐ Hur länge?</h1><div class="grid"><button class="choice easy length" data-length="5">5<span>frågor</span></button><button class="choice normal length" data-length="10">10<span>frågor</span></button><button class="choice hard length" data-length="15">15<span>frågor</span></button><button class="choice read length" data-length="20">20<span>frågor</span></button></div><button id="lengthBack" class="secondary">‹ Tillbaka</button></section>
<section id="adult" class="panel hidden"><div class="big">⚙️</div><h1>För vuxna</h1><div class="setting"><span>🗣️ Röst</span><button id="voiceToggle">På</button></div><div class="setting"><span>🔔 Rätt/fel-ljud</span><button id="fxToggle">På</button></div><div class="setting"><span>👏 Belöningar</span><button id="rewardToggle">På</button></div><button id="resetStars" class="danger">♻️ Nollställ stjärnor</button><div class="build">MiniMix 3.0.4 • build 30401</div><button class="secondary backMenu">‹ Till startsidan</button></section>
<section id="game" class="panel game hidden"><div class="gamebar"><button id="homeAsk">🏠</button><strong id="gameLabel"></strong><button id="repeat">🔊</button></div><div id="round"></div><div class="progress"><i id="progress"></i></div><div id="streak"></div><div id="visual"></div><div id="task" class="task hidden"><small id="taskLabel"></small><div id="taskText" class="fit"></div></div><div id="question" class="question fit"></div><div id="answers" class="answers"></div><div id="feedback" aria-live="polite"></div>
<div id="rewardOverlay" class="overlay hidden"><div><div id="rewardIcon" class="big"></div><h1 id="rewardTitle"></h1><p id="rewardText"></p></div></div><div id="confirmOverlay" class="overlay hidden"><div><div class="big">🏠</div><h1>Avsluta spelet?</h1><button id="keepPlaying" class="primary">▶️ Fortsätt spela</button><button id="exitGame" class="danger">🏠 Avsluta</button></div></div><div id="finishOverlay" class="overlay hidden"><div><div class="big">🏆</div><h1>Fantastiskt!</h1><p id="finishText"></p><button id="playAgain" class="primary">🔄 Spela igen</button><button id="finishHome" class="secondary">🏠 Till startsidan</button></div></div></section></main><script src="app.js"></script><script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));</script></body></html>
